# Netlify — Panel Deploy Konfigürasyonu
# publish dizini: panel/ (repo kökünden deploy ediliyorsa)
[build]
  base = "."
  publish = "panel"

# SPA değil; statik tek dosya. Yine de güvenli header'lar:
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
