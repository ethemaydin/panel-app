<style>

*{box-sizing:border-box}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
#login{max-width:380px;margin:12vh auto;background:var(--card);padding:28px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
#login h1{color:var(--pri);margin:0 0 4px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:800;color:var(--pri);font-size:18px;padding:6px 10px 14px}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer;margin-bottom:2px}
nav a:hover{background:#f4eef0}nav a.on{background:var(--pri);color:#fff}
nav .me{margin-top:16px;padding:10px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
main{padding:22px;max-width:1200px;width:100%}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.sp{flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);max-width:100%}
.fl{display:block;margin:0 0 12px;font-weight:600}

.tw{background:var(--card);border-radius:14px;overflow:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--mute);background:#faf7f8;position:sticky;top:0}
tbody tr[data-id]{cursor:pointer}tbody tr[data-id]:hover{background:#fbf4f5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card b{display:block;font-size:26px}.card span{color:var(--mute);font-size:13px}
.mute{color:var(--mute)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#f0e8ea;font-size:12px}
.tag.ok{background:#dff5ea;color:var(--ok)}.tag.bad{background:#fbe3e1;color:var(--bad)}
.pbar{height:8px;background:#eee;border-radius:9px;overflow:hidden;min-width:70px}.pbar i{display:block;height:100%;background:var(--pri)}
.mo{position:fixed;inset:0;background:rgba(30,10,15,.5);display:grid;place-items:center;z-index:50;padding:14px}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}.md.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .x{border:0;background:none;font-size:18px;cursor:pointer}
.mb{padding:16px 18px;overflow:auto}.mf{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.as{border:1px solid var(--line);border-radius:12px;padding:10px;max-height:320px;overflow:auto;margin-bottom:12px}
.asb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.asb button,.ag button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font-size:12px}.ag{margin:8px 0}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.th{position:relative}
.th img{width:90px;height:64px;object-fit:cover;border-radius:8px}
.th button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140px);background:#25151A;color:#fff;padding:12px 18px;border-radius:12px;transition:.3s;z-index:99;max-width:90%}
#toast.show{transform:translateX(-50%)}#toast.bad{background:var(--bad)}
.perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);vertical-align:middle}
@media(max-width:800px){#app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}nav .brand,nav .me{display:none}nav a{white-space:nowrap}main{padding:14px}}
</style>
</head>

// ============ YARDIMCILAR ============
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,cur='';
const can=p=>!!me&&(me.role==='admin'||!!(me.perms&&me.perms[p]));
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},5000)};
const ok=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const run=async f=>{try{return await f()}catch(e){console.error(e);toast(e.message||String(e),true)}};
const fmtD=d=>d?new Date(d).toLocaleDateString('tr-TR'):'—';
const fmtDT=d=>d?new Date(d).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}):'—';
const ago=d=>{if(!d)return '';const n=Math.floor((Date.now()-new Date(d))/864e5);return n<=0?'bugün':n+' gün önce'};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function fetchAll(mk){let out=[],from=0;for(;;){const d=await ok(mk().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
const studs=()=>fetchAll(()=>sb.from('profiles').select('id,full_name,email,class_id,level,active,created_at,must_change_password').eq('role','student').order('full_name'));
const classes=()=>ok(sb.from('classes').select('*').order('name'));
async function myClasses(){const C=await classes();if(can('all_classes'))return C;const t=await ok(sb.from('teacher_classes').select('class_id').eq('teacher_id',me.id));const s=new Set(t.map(x=>x.class_id));return C.filter(c=>s.has(c.id))}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const toCsv=(rows,cols)=>cols.map(c=>csvq(c[0])).join(',')+'\n'+rows.map(r=>cols.map(c=>csvq(c[1](r))).join(',')).join('\n');
async function fn(action,p){
  const {data,error}=await sb.functions.invoke('admin-users',{body:{action,...p}});
  if(error){
    if(error.name==='FunctionsFetchError'||/Failed to send a request/i.test(error.message||''))
      throw new Error('Hesap fonksiyonuna ulaşılamadı. Supabase > Edge Functions listesinde tam olarak "admin-users" adlı fonksiyon yayında mı? "Verify JWT" ayarı kapalı mı? Soldaki "Fonksiyon testi" düğmesine bas.');
    let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);return data}
async function testFn(){
  toast('Test ediliyor…');
  try{await fn('ping');toast('Hesap fonksiyonu çalışıyor ✓')}
  catch(e){if(/Bilinmeyen işlem/.test(e.message))toast('Hesap fonksiyonu çalışıyor ✓ (eski sürüm, yeniden yayınlaman iyi olur)');else toast(e.message,true)}}
async function readSheet(f){let wb;if(/\.(csv|txt)$/i.test(f.name))wb=XLSX.read(await f.text(),{type:'string'});else wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
function pick(row,al){for(const k of Object.keys(row)){if(al.includes(String(k).trim().toLowerCase()))return String(row[k]).trim()}return ''}
async function upImg(file,max,dir,png){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const type=png?'image/png':'image/jpeg';const blob=await new Promise(r=>c.toBlob(r,type,.85));const path=`${dir}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${png?'png':'jpg'}`;const {error}=await sb.storage.from('content').upload(path,blob,{contentType:type});if(error)throw error;return sb.storage.from('content').getPublicUrl(path).data.publicUrl}

function modal(title,body,onSave,opt={}){
  const m=document.createElement('div');m.className='mo';
  m.innerHTML=`<div class="md${opt.wide?' wide':''}"><div class="mh"><b>${title}</b><button class="x">✕</button></div><div class="mb">${body}</div><div class="mf">${onSave?`<button class="btn" id="msave">${opt.save||'Kaydet'}</button>`:''}${opt.extra||''}</div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('.x').onclick=close;
  m.onmousedown=e=>{if(e.target===m)m._md=1};m.onmouseup=e=>{if(e.target===m&&m._md)close();m._md=0};
  if(onSave)m.querySelector('#msave').onclick=async()=>{const b=m.querySelector('#msave');b.disabled=true;const r=await run(()=>onSave(m));b.disabled=false;if(r===true)close()};
  return {m,close};
}

// ---- form alanları ----
const toLines=(f,v)=>{v=v||[];if(f.type==='dates')return v.join('\n');if(f.type==='qlines')return v.map(q=>[q.q,q.c,...(q.o||[]).filter(x=>x!==q.c)].join(' | ')).join('\n');return v.map(r=>Array.isArray(r)?r.join(' | '):r).join('\n')};
function fld(f,v){
  const id='f_'+f.k,val=v??f.def??'',L=`<label class="fl">${f.label}${f.help?`<small>${f.help}</small>`:''}`;
  if(f.type==='textarea'||f.type==='code')return `${L}<textarea id="${id}" rows="${f.rows||4}" ${f.type==='code'?'style="font-family:monospace"':''}>${esc(val)}</textarea></label>`;
  if(f.type==='select')return `${L}<select id="${id}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if(f.type==='check')return `<label class="fl ck"><input type="checkbox" id="${id}" ${val?'checked':''}> ${f.label}</label>`;
  if(['lines','dates','qlines'].includes(f.type))return `${L}<textarea id="${id}" rows="5" placeholder="${esc(f.ph||'')}">${esc(toLines(f,v))}</textarea></label>`;
  if(f.type==='images')return `${L}<div id="${id}" class="imgs" data-v="${esc(JSON.stringify(v||[]))}"></div><input type="file" accept="image/*" id="${id}_u"></label>`;
  return `${L}<input id="${id}" type="${f.type||'text'}" value="${esc(val)}"></label>`;
}
function rd(root,f){
  const e=root.querySelector('#f_'+f.k);if(!e)return undefined;
  if(f.type==='check')return e.checked;
  if(f.type==='number')return e.value===''?null:+e.value;
  if(f.type==='date'||f.type==='time'||f.type==='select')return e.value===''?null:e.value;
  const lines=()=>e.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(f.type==='lines')return lines().map(s=>s.split('|').map(x=>x.trim()));
  if(f.type==='dates')return lines();
  if(f.type==='qlines')return lines().map(s=>{const p=s.split('|').map(x=>x.trim());return {k:'mc',q:p[0],c:p[1],o:shuf([p[1],...p.slice(2)].filter(Boolean))}}).filter(q=>q.q&&q.c);
  if(f.type==='images')return JSON.parse(e.dataset.v||'[]');
  return e.value.trim();
}
function bindImages(root,fs){
  fs.filter(f=>f.type==='images').forEach(f=>{
    const box=root.querySelector('#f_'+f.k),inp=root.querySelector('#f_'+f.k+'_u');
    const draw=()=>{const a=JSON.parse(box.dataset.v||'[]');box.innerHTML=a.map((u,i)=>`<span class="th"><img src="${esc(u)}" alt=""><button type="button" data-i="${i}">✕</button></span>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);box.dataset.v=JSON.stringify(a);draw()})};
    draw();
    inp.onchange=()=>run(async()=>{const x=inp.files[0];if(!x)return;toast('Yükleniyor…');const u=await upImg(x,1000,'topics');const a=JSON.parse(box.dataset.v||'[]');a.push(u);box.dataset.v=JSON.stringify(a);draw();inp.value='';toast('Resim eklendi')});
  });
}
// ---- öğrenci seçici ----
function assignHtml(aid,S,C,sel){
  const row=s=>`<label class="ck"><input type="checkbox" value="${s.id}" data-lv="${s.level}" ${sel.has(s.id)?'checked':''}> ${esc(s.full_name||s.email)} <small class="mute">${s.level}${s.active?'':' · pasif'}</small></label>`;
  const nocl=S.filter(s=>!s.class_id||!C.some(c=>c.id===s.class_id));
  return `<div class="as" id="${aid}"><div class="asb"><button type="button" data-a="all">Hepsini seç</button><button type="button" data-a="none">Hiçbiri</button>${LV.map(l=>`<button type="button" data-l="${l}">${l} seviyesi</button>`).join('')}</div>`
   +C.map(c=>`<div class="ag"><b>${esc(c.name)}</b> <button type="button" data-c="1">Sınıfı seç / kaldır</button>${S.filter(s=>s.class_id===c.id).map(row).join('')||'<div class="mute">Öğrenci yok</div>'}</div>`).join('')
   +(nocl.length?`<div class="ag"><b>Sınıfsız</b> <button type="button" data-c="1">Seç / kaldır</button>${nocl.map(row).join('')}</div>`:'')+'</div>';
}
function bindAssign(a){a.onclick=e=>{const b=e.target.closest('button');if(!b)return;const cbs=[...a.querySelectorAll('input[type=checkbox]')];if(b.dataset.a)cbs.forEach(x=>{x.checked=b.dataset.a==='all'});else if(b.dataset.l)cbs.forEach(x=>{if(x.dataset.lv===b.dataset.l)x.checked=true});else if(b.dataset.c){const g=[...b.parentElement.querySelectorAll('input')];const all=g.every(x=>x.checked);g.forEach(x=>{x.checked=!all})}}}
const getAssign=a=>[...a.querySelectorAll('input:checked')].map(x=>x.value);
async function saveJoin(t,kc,kv,oc,ids){
  const ex=(await ok(sb.from(t).select(oc).eq(kc,kv))).map(r=>r[oc]);
  const del=ex.filter(x=>!ids.includes(x)),add=ids.filter(x=>!ex.includes(x));
  if(del.length)await ok(sb.from(t).delete().eq(kc,kv).in(oc,del));
  if(add.length)await ok(sb.from(t).insert(add.map(x=>({[kc]:kv,[oc]:x}))));
}

// ---- Genel içerik formu (kelime vb. tablolar için) ----
async function openForm(c,row){
  const body=c.fields.map(f=>fld(f,row?row[f.k]:'')).join('');
  const {m}=modal(row?'Düzenle':'Yeni kayıt',body,async m=>{
    const o={};
    for(const f of c.fields){const v=rd(m,f);if(v===undefined)throw new Error(f.label+' alanını okuyamadım');o[f.k]=v}
    if(!String(o[c.fields[0].k]??'').trim()&&typeof o[c.fields[0].k]==='string')throw new Error(c.fields[0].label+' gerekli');
    if(row)await ok(sb.from(c.table).update(o).eq('id',row.id));
    else await ok(sb.from(c.table).insert(o));
    toast('Kaydedildi ✓');if(c.after)await c.after();return true;
  });
  bindImages(m,c.fields);
}

// ---- Toplu giriş / test soru sihirbazı yardımcıları ----
const yesNo=v=>['1','true','evet','e','aktif','var','on'].includes(String(v??'').trim().toLowerCase());
const numOrNull=v=>{const s=String(v??'').trim();if(!s)return null;const n=Number(s.replace(',','.'));return isNaN(n)?null:n};
const dateOrNull=v=>{
  const s=String(v??'').trim();
  if(!s)return null;
  if(/^\d+(\.\d+)?$/.test(s)){
    const n=Number(s);
    if(n>20000&&n<60000){
      const d=new Date(Math.round((n-25569)*86400000));
      return isNaN(d)?null:d.toISOString().slice(0,10);
    }
  }
  const d=new Date(s);
  return isNaN(d)?null:d.toISOString().slice(0,10);
};
const timeStr=v=>{
  const s=String(v??'').trim();
  if(!s)return null;
  if(/^\d+(\.\d+)?$/.test(s)){
    const d=new Date(0);
    d.setSeconds(Math.round(Number(s)*86400));
    return d.toISOString().slice(11,16);
  }
  const m=s.match(/(\d{1,2}):(\d{2})/);
  return m?`${m[1].padStart(2,'0')}:${m[2]}`:s;
};
const listSplit=v=>String(v??'').split(/[;,\n\t]+/).map(x=>x.trim()).filter(Boolean);
const normStaffRole=v=>{
  const s=String(v??'').trim().toLowerCase();
  if(['öğretmen','ogretmen','teacher'].includes(s))return 'teacher';
  if(['yönetici','yonetici','admin','administrator'].includes(s))return 'admin';
  return '';
};

async function topicMap(){
  const T=await ok(sb.from('topics').select('id,title'));
  return Object.fromEntries(T.map(t=>[String(t.title||'').trim().toLowerCase(),t.id]));
}

function parseBulkTestQuestions(v){
  return String(v||'').split('||').map(s=>s.trim()).filter(Boolean).map(seg=>{
    const p=seg.split('|').map(x=>x.trim());
    if(!p[0]||!p[1])return null;
    return {k:'mc',q:p[0],c:p[1],o:shuf([p[1],p[2],p[3]].filter(Boolean))};
  }).filter(Boolean);
}

function questionsToItems(qs){
  return (Array.isArray(qs)?qs:[]).slice(0,MAX_TEST_Q).map(q=>{
    const wrongs=(q.o||[]).filter(x=>x!==q.c);
    return {q:q.q||'',c:q.c||'',w1:wrongs[0]||'',w2:wrongs[1]||''};
  });
}

function collectQB(m){
  const out=[];
  for(let i=1;i<=MAX_TEST_Q;i++){
    const q=m.querySelector('#qq_'+i);
    if(!q)break;
    out.push({
      q:q.value||'',
      c:(m.querySelector('#qc_'+i)?.value)||'',
      w1:(m.querySelector('#qw1_'+i)?.value)||'',
      w2:(m.querySelector('#qw2_'+i)?.value)||''
    });
  }
  return out;
}

function qBuilderHtml(count,items=[]){
  let html=`<div class="fl"><b>Test soruları</b><small>En fazla ${MAX_TEST_Q} soru. Soru ve doğru cevap boş bırakılan satırlar kaydedilmez.</small></div><div id="qlist">`;
  for(let i=1;i<=count;i++){
    const it=items[i-1]||{q:'',c:'',w1:'',w2:''};
    html+=`<div class="tw" style="margin:0 0 8px"><table><tbody><tr>
      <td style="width:42px"><b>${i}</b></td>
      <td><input id="qq_${i}" value="${esc(it.q)}" placeholder="Soru"></td>
      <td><input id="qc_${i}" value="${esc(it.c)}" placeholder="Doğru cevap"></td>
      <td><input id="qw1_${i}" value="${esc(it.w1)}" placeholder="Yanlış 1"></td>
      <td><input id="qw2_${i}" value="${esc(it.w2)}" placeholder="Yanlış 2"></td>
    </tr></tbody></table></div>`;
  }
  return html+'</div>';
}

function renderQB(m,row,preserve){
  const kind=m.querySelector('#f_kind');
  const count=m.querySelector('#f_question_count');
  const isTest=kind?.value==='test';
  const countFl=count?.closest('.fl');
  if(countFl)countFl.style.display=isTest?'':'none';

  const old=m.querySelector('#qbuild');
  const prev=preserve&&old?collectQB(m):null;
  if(old)old.remove();
  if(!isTest)return;

  const n=Math.min(MAX_TEST_Q,Math.max(1,parseInt(count?.value||'10',10)));
  const items=prev||questionsToItems(row?.questions);
  const div=document.createElement('div');
  div.id='qbuild';
  div.innerHTML=qBuilderHtml(n,items);

  const mb=m.querySelector('.mb');
  const as=mb.querySelector('.as');
  if(as)mb.insertBefore(div,as);
  else mb.appendChild(div);
}

function bindHomeworkTest(m,row){
  const kind=m.querySelector('#f_kind');
  const count=m.querySelector('#f_question_count');
  if(count&&Array.isArray(row?.questions)&&row.questions.length){
    count.value=String(Math.min(MAX_TEST_Q,row.questions.length));
  }
  kind?.addEventListener('change',()=>renderQB(m,row,false));
  count?.addEventListener('change',()=>renderQB(m,row,true));
  renderQB(m,row,false);
}

async function readHomeworkTest(m,d){
  const kind=m.querySelector('#f_kind')?.value;
  delete d.question_count;
  if(kind!=='test'){
    d.questions=[];
    return;
  }
  const items=collectQB(m).map(x=>({
    q:String(x.q||'').trim(),
    c:String(x.c||'').trim(),
    w1:String(x.w1||'').trim(),
    w2:String(x.w2||'').trim()
  })).filter(x=>x.q&&x.c);
  if(!items.length)throw new Error('En az 1 soru ve doğru cevap gir.');
  d.questions=items.map(x=>({
    k:'mc',
    q:x.q,
    c:x.c,
    o:shuf([x.c,x.w1,x.w2].filter(Boolean))
  }));
}

  if(id==='students')return can('students.view');
  if(id==='teachers')return can('students.view');
  if(id==='topics'||id==='questions')return can('topics.manage');
  if(id==='words')return can('words.manage');
  if(id==='homework')return can('homework.manage');
  if(id==='lessons')return can('lessons.manage');
  if(id==='attend')return can('attendance.take');
  if(id==='messages')return can('messages.send');
  if(id==='settings')return me.role==='admin';
  if(id==='audit')return me.role==='admin';
  return true;
};

function go(id){
  if(!PAGES.find(p=>p[0]===id))id='dash';
  cur=id;
  location.hash=id;
  $('#nav').querySelectorAll('a').forEach(a=>{a.classList.toggle('on',a.dataset.id===id)});
  const map={dash:pDash,students:pStudents,teachers:pTeachers,classes:pClasses,topics:pTopics,questions:pQuestions,words:pWords,homework:pHomework,lessons:pLessons,attend:pAttend,messages:pMessages,settings:pSettings,audit:pAudit};
  $('#main').innerHTML='<p class="mute">Yükleniyor…</p>';
  run(()=>map[id]());
}

async function pTopics(){

    main.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.toggle;if(open.has(id))open.delete(id);else open.add(id);draw()});

  function editTopic(row){
    const d=row?.data||{};
    const {m}=modal(row?'Konuyu düzenle':'Yeni konu',`<label class="fl">Başlık<input id="tt1" value="${esc(row?.title||'')}"></label><label class="fl">Sıra<input type="number" id="tt2" value="${row?.sort_order??0}"></label><div class="row2"><label class="fl">İkon (emoji)<input id="tt3" value="${esc(d.icon||'📘')}" placeholder="📘"></label><label class="fl">Seviye<select id="tt4">${['A1','A2','B1','B2','C1'].map(l=>`<option value="${l}" ${d.level===l?'selected':''}>${l}</option>`).join('')}</select></label></div><label class="fl">Kısa açıklama<input id="tt5" value="${esc(d.desc||'')}" placeholder="Öğrencinin kartta göreceği metin"></label><label class="fl">Konu anlatımı<textarea id="tt6" rows="3" placeholder="Konu açılınca gösterilen giriş metni">${esc(d.exp||'')}</textarea></label><label class="fl">Kelime örnekleri<small>Her satır: ingilizce | türkçe (öğrenci kelime listesinde görünür)</small><textarea id="tt7" rows="4" style="font-family:monospace">${esc((Array.isArray(d.words)?d.words:[]).map(w=>Array.isArray(w)?w.join(' | '):'').join('\n'))}</textarea></label>`,async m=>{
      const title=m.querySelector('#tt1').value.trim(),sort_order=+m.querySelector('#tt2').value||0;

      const data={icon,level,desc,exp,words};
      if(row)await ok(sb.from('topics').update({title,sort_order,data}).eq('id',row.id));
      else await ok(sb.from('topics').insert({title,sort_order,data}));
      toast('Kaydedildi ✓');setTimeout(()=>go('topics'),0);return true},{extra:row?'<button class="btn ghost bad" id="td">Sil</button>':''});

    const d=m.querySelector('#sd');

  }
  draw();

    main.querySelectorAll('tbody tr[data-id]').forEach(tr=>tr.onclick=()=>edit(rows.find(r=>r.id===tr.dataset.id)));
  };
  const form=(k,d={})=>{
    const wl=(arr)=>esc((arr||[]).join('\n'));
    if(k==='mc')return `<label class="fl">Soru<input id="q1" value="${esc(d.q||'')}"></label><label class="fl">Doğru cevap<input id="q2" value="${esc(d.c||'')}"></label><label class="fl">Yanlış cevaplar<small>Her satıra bir tane</small><textarea id="q3" rows="3">${wl((d.o||[]).filter(x=>x!==d.c))}</textarea></label>`;
    if(k==='fill')return `<label class="fl">Cümle<small>Boşluğun yerine ___ yaz</small><input id="q1" value="${esc(d.q||'')}"></label><label class="fl">İpucu (isteğe bağlı)<input id="q3" value="${esc(d.h||'')}"></label><label class="fl">Doğru cevap<small>Birden fazla kabul için | ile ayır: is | 's</small><input id="q2" value="${esc([].concat(d.a||[]).join(' | '))}"></label>`;
    if(k==='order')return `<label class="fl">Türkçe cümle<input id="q1" value="${esc((d.q||'').replace(/[“”]/g,''))}"></label><label class="fl">İngilizce cümle<small>Kelimeler öğrenciye karışık gelir</small><input id="q2" value="${esc((d.w||[]).join(' '))}"></label>`;
    return `<label class="fl">İngilizce cümle (seslendirilir)<input id="q2" value="${esc(d.s||'')}"></label><label class="fl">Yanlış seçenekler<small>Her satıra bir tane</small><textarea id="q3" rows="3">${wl((d.o||[]).filter(x=>x!==d.s))}</textarea></label>`;
  };
  const read=(k,m)=>{
    const g=i=>(m.querySelector(i)?m.querySelector(i).value.trim():''),ls=i=>g(i).split('\n').map(s=>s.trim()).filter(Boolean);
    if(k==='mc'){if(!g('#q1')||!g('#q2'))throw new Error('Soru ve doğru cevap gerekli');return {q:g('#q1'),c:g('#q2'),o:shuf([g('#q2'),...ls('#q3')])}}

    if(k==='order'){const w=g('#q2').split(/\s+/).filter(Boolean);if(!g('#q1')||w.length<2)throw new Error('Türkçe cümle ve en az 2 kelimelik İngilizce cümle gerekli');return {q:'“'+g('#q1')+'”',w}}

  };

    const k0=row?row.kind:'mc';
    const {m}=modal(row?'Soruyu düzenle':'Yeni soru',`<label class="fl">Konu<select id="qt">${T.map(t=>`<option value="${t.id}" ${row&&row.topic_id===t.id?'selected':(ft===t.id&&!row?'selected':'')}>${esc(t.title)}</option>`).join('')}</select></label><label class="fl">Soru tipi<select id="qk" ${row?'disabled':''}>${Object.keys(KN).map(k=>`<option value="${k}" ${k===k0?'selected':''}>${KN[k]}</option>`).join('')}</select></label><div id="qf">${form(k0,row?row.data:{})}</div>`,async m=>{
      const kind=m.querySelector('#qk').value,data=read(kind,m),tid=m.querySelector('#qt').value;
      if(row)await ok(sb.from('questions').update({topic_id:tid,data}).eq('id',row.id));else await ok(sb.from('questions').insert({topic_id:tid,kind,data}));
      toast('Kaydedildi ✓');setTimeout(()=>go('questions'),0);return true},{extra:row?'<button class="btn ghost bad" id="qd">Sil</button>':''});
    if(!row)m.querySelector('#qk').onchange=e=>{m.querySelector('#qf').innerHTML=form(e.target.value,{})};
    const d=m.querySelector('#qd');if(d)d.onclick=()=>{if(!confirm('Soru silinsin mi?'))return;run(async()=>{await ok(sb.from('questions').delete().eq('id',row.id));m.remove();toast('Silindi');go('questions')})};
  }
  draw();
}

  function importWords(){
    const AL={en:['en','english','ingilizce','kelime','word'],tr:['tr','turkce','türkçe','anlam','anlamı','anlami','meaning'],phonetic:['phonetic','okunus','okunuş','telaffuz','pronunciation'],example:['example','ornek','örnek','ornek cumle','örnek cümle','cumle','cümle','sentence'],level:['level','seviye','duzey','düzey']};
    const {m}=modal('Kelimeleri toplu yükle',`<p>Excel (.xlsx) ya da CSV dosyası seç. İlk satır başlık olmalı: <b>en, tr, phonetic, example, level</b>. Türkçe başlıklar da olur: kelime, anlam, okunuş, örnek cümle, seviye. 1000 kelime tek seferde yüklenir.</p><p><button class="btn ghost" id="wt">Örnek şablonu indir</button></p><label class="fl">Dosya<input type="file" id="wf" accept=".xlsx,.xls,.csv,.txt"></label><label class="fl">Dosyada seviye sütunu yoksa hepsi için<select id="wdef">${LV.map(l=>`<option>${l}</option>`).join('')}</select></label><label class="ck"><input type="checkbox" id="wskip" checked> Aynı kelime (aynı seviyede) varsa atla</label><div id="wprev"></div>`,null,{wide:true,extra:'<button class="btn" id="wgo" disabled>Yükle</button>'});
    let parsed=[];
    m.querySelector('#wt').onclick=()=>dl('kelime-sablonu.csv','en,tr,phonetic,example,level\nhello,merhaba,heh-LOH,"Hello, my name is Elif.",A1\nweather,hava durumu,WEDH-er,The weather is nice today.,A2\n');
    m.querySelector('#wf').onchange=e=>run(async()=>{
      const x=e.target.files[0];if(!x)return;const raw=await readSheet(x),def=m.querySelector('#wdef').value;
      parsed=raw.map(r=>{let lv=pick(r,AL.level).toUpperCase();return {en:pick(r,AL.en),tr:pick(r,AL.tr),phonetic:pick(r,AL.phonetic),example:pick(r,AL.example),level:LV.includes(lv)?lv:def}});
      const good=parsed.filter(r=>r.en&&r.tr),bad=parsed.length-good.length;parsed=good;
      m.querySelector('#wprev').innerHTML=`<p><b>${good.length}</b> kelime okundu${bad?`, <span style="color:var(--bad)">${bad} satır eksik (İngilizce ya da Türkçe boş) atlanacak</span>`:''}.</p>${good.length?`<div class="tw"><table><thead><tr><th>en</th><th>tr</th><th>okunuş</th><th>örnek</th><th>seviye</th></tr></thead><tbody>${good.slice(0,8).map(r=>`<tr><td>${esc(r.en)}</td><td>${esc(r.tr)}</td><td>${esc(r.phonetic)}</td><td>${esc(r.example)}</td><td>${r.level}</td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--bad)">Başlıklar tanınmadı. İlk satırın en, tr, phonetic, example, level olduğundan emin ol.</p>'}`;

    });
    m.querySelector('#wgo').onclick=()=>run(async()=>{
      const b=m.querySelector('#wgo');b.disabled=true;let list=parsed;
      if(m.querySelector('#wskip').checked){const have=new Set(rows.map(r=>r.en.toLowerCase()+'|'+r.level));list=list.filter(r=>{const k=r.en.toLowerCase()+'|'+r.level;if(have.has(k))return false;have.add(k);return true})}
      for(let i=0;i<list.length;i+=500){m.querySelector('#wprev').innerHTML=`<p>Yükleniyor… ${Math.min(i+500,list.length)}/${list.length}</p>`;await ok(sb.from('words').insert(list.slice(i,i+500)))}
      toast(`${list.length} kelime yüklendi ✓ (${parsed.length-list.length} tekrar atlandı)`);m.remove();await reload();
    });
  }
  draw();
}

  const [S,C]=await Promise.all([studs(),classes()]);
  const M=await ok(sb.from('messages').select('*,message_targets(count)').order('created_at',{ascending:false}).limit(60));
  main.innerHTML=`<div class="bar"><h1>Bildirimler</h1></div><div class="tw" style="padding:16px"><label class="fl">Başlık<input id="m1"></label><label class="fl">Mesaj<textarea id="m2" rows="3"></textarea></label><div class="fl">Kime?</div>${assignHtml('as_msg',S,C,new Set())}<label class="ck"><input type="checkbox" id="m3"> Planlı gönder</label><div id="m4" hidden><label class="fl">Gönderim zamanı<input type="datetime-local" id="m5"></label></div><button class="btn" id="msend">Gönder</button><p class="mute">Planlı mesajlar zamanı gelince öğrencilerin bildirimlerine düşer (veritabanında pg_cron açıksa otomatik, değilse bu sayfayı açtığında).</p></div><h2>Mesajlar</h2><div class="tw"><table><thead><tr><th>Başlık</th><th>Alıcı</th><th>Durum</th><th></th></tr></thead><tbody>${M.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small class="mute">${esc(x.body)}</small></td><td>${x.message_targets?.[0]?.count??0}</td><td>${x.sent?'<span class="tag ok">gönderildi</span><br><small>'+fmtDT(x.sent_at)+'</small>':'<span class="tag">planlı</span><br><small>'+fmtDT(x.send_at)+'</small>'}</td><td>${x.sent?'':`<button class="btn ghost" data-now="${x.id}">Şimdi gönder</button> `}<button class="btn ghost bad" data-del="${x.id}">Sil</button></td></tr>`).join('')||'<tr><td colspan="4" class="mute">Mesaj yok</td></tr>'}</tbody></table></div>`;
  bindAssign($('#as_msg'));
  $('#m3').onchange=e=>{$('#m4').hidden=!e.target.checked};
  $('#msend').onclick=()=>run(async()=>{
    const t=$('#m1').value.trim(),b=$('#m2').value.trim(),ids=getAssign($('#as_msg')),plan=$('#m3').checked;
    if(!t||!b)throw new Error('Başlık ve mesaj yaz');if(!ids.length)throw new Error('En az bir öğrenci seç');
    let at=new Date();if(plan){at=new Date($('#m5').value);if(isNaN(at)||at<=new Date())throw new Error('Planlı zaman gelecekte olmalı')}
    const msg=await ok(sb.from('messages').insert({title:t,body:b,send_at:at.toISOString()}).select().single());
    await ok(sb.from('message_targets').insert(ids.map(x=>({message_id:msg.id,student_id:x}))));
    if(!plan)await ok(sb.rpc('deliver_due_messages'));
    toast(plan?'Planlandı ✓':ids.length+' öğrenciye gönderildi ✓');go('messages');
  });
  main.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>run(async()=>{await ok(sb.from('messages').update({send_at:new Date().toISOString()}).eq('id',b.dataset.now));await ok(sb.rpc('deliver_due_messages'));toast('Gönderildi ✓');go('messages')}));
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Mesaj silinsin mi? (Öğrencilere zaten giden bildirim kalır)'))return;await ok(sb.from('messages').delete().eq('id',b.dataset.del));go('messages')}));
  run(()=>ok(sb.rpc('deliver_due_messages')));
}

// ---- Tasarım ve ayarlar ----
async function pSettings(){
  const main=$('#main');
  const rows=await ok(sb.from('app_settings').select('*').order('key'));const cur=Object.fromEntries(rows.map(r=>[r.key,r.value]));
  const K=[['app_name','Uygulama adı','text'],['logo_url','Logo','logo'],['primary_color','Ana renk','color'],['background_color','Arka plan rengi','color'],['text_color','Yazı rengi','color'],['welcome_text','Giriş ekranı mesajı','textarea'],['word_goal_min','En az günlük kelime','number'],['word_goal_max','En çok günlük kelime','number'],['pass_mark','Konu testi geçme notu (%)','number'],['maintenance_message','Bakım mesajı','textarea','Doluysa öğrenciler uygulamayı kullanamaz, bu mesajı görür'],['custom_css','Özel CSS','code','Uygulamanın görünümünü kodla değiştir. Kaydettikten sonra uygulama açılışta uygular']];
  const known=new Set(K.map(k=>k[0])),extra=Object.keys(cur).filter(k=>!known.has(k));
  const inp=(k,l,t,h)=>{const v=cur[k]??'';const id='s_'+k;const L=`<label class="fl">${l}${h?`<small>${h}</small>`:''}`;
    if(t==='textarea'||t==='code')return `${L}<textarea id="${id}" rows="${t==='code'?8:3}" ${t==='code'?'style="font-family:monospace"':''}>${esc(v)}</textarea></label>`;
    if(t==='color')return `${L}<input type="color" id="${id}" value="${esc(v||'#000000')}" style="width:80px;padding:2px"></label>`;
    if(t==='logo')return `${L}<input id="${id}" value="${esc(v)}" placeholder="https://…"><input type="file" accept="image/*" id="${id}_u"><div>${v?`<img src="${esc(v)}" alt="" style="max-height:70px;margin-top:6px;background:#eee;border-radius:8px">`:''}</div></label>`;
    return `${L}<input id="${id}" type="${t}" value="${esc(v)}"></label>`};
  main.innerHTML=`<div class="bar"><h1>Tasarım ve ayarlar</h1><span class="sp"></span><button class="btn" id="ssave">Kaydet</button></div><p class="mute">Burada yaptığın değişiklikler uygulamaya mağaza güncellemesi gerekmeden yansır. Kaydettikten sonra öğrenciler uygulamayı bir sonraki açışında görür.</p><div class="tw" style="padding:16px">${K.map(k=>inp(k[0],k[1],k[2],k[3])).join('')}${extra.length?`<h2>Diğer ayarlar</h2>${extra.map(k=>`<label class="fl">${esc(k)}<input data-x="${esc(k)}" value="${esc(typeof cur[k]==='string'?cur[k]:JSON.stringify(cur[k]))}"></label>`).join('')}`:''}<h2>Yeni ayar ekle</h2><div class="bar"><input id="nk" placeholder="anahtar (örn: duyuru_baslik)"><input id="nv" placeholder="değer"></div></div>`;
  main.querySelectorAll('input[type=file]').forEach(f=>f.onchange=()=>run(async()=>{const x=f.files[0];if(!x)return;toast('Yükleniyor…');const u=await upImg(x,600,'branding',true);const id=f.id.replace('_u','');$('#'+id).value=u;toast('Logo yüklendi, Kaydet\'e bas')}));
  $('#ssave').onclick=()=>run(async()=>{
    const out=[];
    for(const [k,,t] of K){const e=$('#s_'+k);if(!e)continue;let v=e.value;if(t==='number')v=v===''?null:+v;out.push({key:k,value:v,updated_at:new Date().toISOString(),updated_by:me.id})}
    main.querySelectorAll('[data-x]').forEach(e=>{let v=e.value;try{v=JSON.parse(v)}catch(_){}out.push({key:e.dataset.x,value:v,updated_at:new Date().toISOString(),updated_by:me.id})});
    const nk=$('#nk').value.trim();if(nk){let v=$('#nv').value;try{v=JSON.parse(v)}catch(_){}out.push({key:nk,value:v,updated_at:new Date().toISOString(),updated_by:me.id})}
    await ok(sb.from('app_settings').upsert(out,{onConflict:'key'}));toast('Ayarlar kaydedildi ✓');go('settings');
  });
}

// ---- İşlem kaydı ----
async function pAudit(){
  const main=$('#main');
  const A=await ok(sb.from('audit_log').select('*').order('at',{ascending:false}).limit(400));
  let f={t:'',q:''};
  const draw=()=>{
    const L=A.filter(a=>(!f.t||a.table_name===f.t)&&(!f.q||(a.actor_name||'').toLowerCase().includes(f.q)));
    const sumr=a=>{const d=a.detail||{};return d.title||d.full_name||d.name||d.en||d.email||d.key||''};
    main.innerHTML=`<div class="bar"><h1>İşlem kaydı</h1><span class="sp"></span><input id="aq" placeholder="Kişi ara…" value="${esc(f.q)}"><select id="at"><option value="">Tüm alanlar</option>${[...new Set(A.map(a=>a.table_name))].map(t=>`<option value="${t}" ${f.t===t?'selected':''}>${esc(TRN[t]||t)}</option>`).join('')}</select></div><p class="mute">Son 400 işlem. Kim, ne zaman, neyi ekledi/değiştirdi/sildi.</p><div class="tw"><table><thead><tr><th>Zaman</th><th>Kim</th><th>İşlem</th><th>Ne</th></tr></thead><tbody>${L.map(a=>`<tr><td>${fmtDT(a.at)}</td><td>${esc(a.actor_name||'Sistem')}</td><td>${esc(ACT[a.action]||a.action)}</td><td>${esc(TRN[a.table_name]||a.table_name)}${sumr(a)?': '+esc(sumr(a)):''}</td></tr>`).join('')||'<tr><td colspan="4" class="mute">Kayıt yok</td></tr>'}</tbody></table></div>`;
    $('#aq').oninput=e=>{f.q=e.target.value.toLowerCase();const p=e.target.selectionStart;draw();$('#aq').focus();$('#aq').setSelectionRange(p,p)};$('#at').onchange=e=>{f.t=e.target.value;draw()};
  };
  draw();
}

// ============ GİRİŞ ============
function showLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||''}
async function enter(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showLogin();return}
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!p||!p.active||!['admin','teacher'].includes(p.role)){await sb.auth.signOut();showLogin('Bu panele sadece öğretmen ve yöneticiler girebilir.');return}
  me=p;$('#login').hidden=true;$('#app').hidden=false;
  $('#nav').innerHTML=`<div class="brand">English Base</div>`+PAGES.filter(allowed).map(x=>`<a data-id="${x[0]}">${x[1]} ${x[2]}</a>`).join('')+`<div class="me">${esc(p.full_name||p.email)}<br>${p.role==='admin'?'Yönetici':'Öğretmen'}<br><a id="ltest" style="padding:6px 0;color:var(--pri)">🔌 Fonksiyon testi</a><br><a id="lout" style="padding:6px 0;color:var(--pri)">Çıkış yap</a></div>`;
  $('#nav').onclick=e=>{const a=e.target.closest('a[data-id]');if(a)go(a.dataset.id)};
  $('#ltest').onclick=()=>testFn();
  $('#lout').onclick=async()=>{await sb.auth.signOut();me=null;showLogin()};
  go(location.hash.slice(1)||'dash');
}
$('#lgo').onclick=async()=>{
  $('#lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#lem').value.trim(),password:$('#lpw').value});
  if(error){$('#lerr').textContent='E-posta ya da şifre hatalı';return}
  await run(enter);
};
$('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgo').click()});
window.addEventListener('hashchange',()=>{if(me&&location.hash.slice(1)!==cur)go(location.hash.slice(1))});
function recovery(){$('#login').hidden=true;$('#app').hidden=true;$('#rec').hidden=false}
$('#lfg').onclick=async()=>{
  const em=$('#lem').value.trim(),e=$('#lerr');
  if(!em){e.style.color='var(--bad)';e.textContent='Önce e-posta adresini yaz';return}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  e.style.color=error?'var(--bad)':'var(--ok)';e.textContent=error?error.message:'Şifre sıfırlama bağlantısı e-postana gönderildi.';
};
$('#rgo').onclick=async()=>{
  const a=$('#rp1').value,b=$('#rp2').value,e=$('#rerr');e.style.color='var(--bad)';
  if(a.length<8){e.textContent='En az 8 karakter olmalı';return}
  if(a!==b){e.textContent='Şifreler aynı değil';return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){e.textContent=error.message;return}
  $('#rec').hidden=true;history.replaceState(null,'',location.pathname);
  await run(enter);toast('Şifren değişti ✓');
};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recovery()});
(async()=>{if(isRec){recovery();return}const {data:{session}}=await sb.auth.getSession();if(session)await run(enter);else showLogin()})();
</script>
